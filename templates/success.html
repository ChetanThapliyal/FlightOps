<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Success - FlightOps</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="glass-panel" style="text-align: center;">
        <div style="font-size: 4rem; color: var(--success); margin-bottom: 1rem;">✓</div>
        <h1 style="color: var(--success);">Payment Successful!</h1>
        <h2 style="font-weight: 400; margin-top: 1rem;">Thank you for your purchase.</h2>
        
        <div style="background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; margin-top: 2rem;">
            <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">Your Ticket ID</p>
            <h3 style="font-family: monospace; font-size: 1.5rem; letter-spacing: 2px; color: var(--primary);">{{ ticket_id }}</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 1rem;">Please save this ID in case you need to cancel your flight.</p>
        </div>
        
        <a href="/shop" style="display: inline-block; margin-top: 2rem; background: rgba(255,255,255,0.1); padding: 0.75rem 1.5rem; border-radius: 8px;">Back to Dashboard</a>
    </div>
</body>
</html>
