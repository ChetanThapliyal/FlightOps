<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Dashboard - FlightOps</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="page-title">Welcome, {{ name }}</h1>
    
    <div class="grid-layout">
        <!-- Buy Ticket Panel -->
        <div class="glass-panel">
            <h3>Book a Flight</h3>
            <form action="/ticket" method="post">
                <label for="buy-departure">Departure</label>
                <input type="text" id="buy-departure" name="buy-departure" placeholder="Where from?">
                
                <label for="buy-destination">Arrival</label>
                <input type="text" id="buy-destination" name="buy-destination" placeholder="Where to?">
                
                <button type="submit">Search Tickets</button>
            </form>
        </div>

        <!-- Delete Ticket Panel -->
        <div class="glass-panel">
            <h3>Cancel a Flight</h3>
            <form action="/ticket" method="post">
                <label for="delete-departure">Departure</label>
                <input type="text" id="delete-departure" name="delete-departure" placeholder="Where from?">
                
                <label for="delete-destination">Arrival</label>
                <input type="text" id="delete-destination" name="delete-destination" placeholder="Where to?">
                
                <button type="submit" class="danger">Find Ticket to Cancel</button>
            </form>
        </div>
    </div>

    {% if flights and flights|length > 0 %}
    <div class="glass-panel wide" style="margin-top: 2rem;">
        <h2>Your Itinerary</h2>
        <table>
            <thead>
                <tr>
                    <th>Departure</th>
                    <th>Destination</th>
                    <th>Departure Time</th>
                    <th>Arrival Time</th>
                </tr>
            </thead>
            <tbody>
                {% for flight in flights %}
                <tr>
                    <td>{{ flight[0] }}</td>
                    <td>{{ flight[1] }}</td>
                    <td>{{ flight[2] }}</td>
                    <td>{{ flight[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endif %}
</body>
</html>
