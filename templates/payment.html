<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Payment - FlightOps</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="glass-panel">
        <h1 class="page-title">Secure Payment</h1>
        <form action="/success" method="post">
            <label for="name">Name on Card</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
            
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" name="card-number" required placeholder="XXXX XXXX XXXX XXXX">
            
            <div class="payment-grid">
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <label for="expiration">Expiration Date</label>
                    <input type="text" id="expiration" name="expiration" required placeholder="MM/YY">
                </div>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" name="cvv" required placeholder="123">
                </div>
            </div>
            
            <button type="submit" style="margin-top: 1.5rem;">Submit Payment</button>
        </form>
    </div>
</body>
</html>
