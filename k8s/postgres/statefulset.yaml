apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: flightops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flightops
    app.kubernetes.io/component: database
spec:
  serviceName: "postgres"
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: flightops
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16.4-alpine
        imagePullPolicy: IfNotPresent
        args:
          - "-c"
          - "listen_addresses=*"
          - "-c"
          - "shared_buffers=256MB"
          - "-c"
          - "work_mem=16MB"
          - "-c"
          - "maintenance_work_mem=64MB"
          - "-c"
          - "effective_cache_size=512MB"
          - "-c"
          - "max_connections=100"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: creds
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: creds
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: creds
              key: dbname
        ports:
        - containerPort: 5432
          name: postgres
        startupProbe:
          exec:
            command:
            - pg_isready
            - "-U"
            - "$(POSTGRES_USER)"
            - "-d"
            - "$(POSTGRES_DB)"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - pg_isready
            - "-U"
            - "$(POSTGRES_USER)"
            - "-d"
            - "$(POSTGRES_DB)"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - pg_isready
            - "-U"
            - "$(POSTGRES_USER)"
            - "-d"
            - "$(POSTGRES_DB)"
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: postgres-pvc
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-pvc
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi