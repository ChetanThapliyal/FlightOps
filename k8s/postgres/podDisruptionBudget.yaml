apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: flightops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flightops
    app.kubernetes.io/component: database
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
