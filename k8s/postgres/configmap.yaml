apiVersion: v1
kind: ConfigMap
metadata:
  name: flightops-init-sql
  namespace: flightops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flightops
    app.kubernetes.io/component: database-migration
data:
  001_create_states.sql: |
    -- =============================================================================
    -- Migration: 001_create_states.sql
    -- Table:     states
    -- Purpose:   Lookup table for all 50 US states.
    --            Referenced as a FK by flights and tickets tables.
    -- Seed:      All 50 US states (state_code + state_name).
    -- Run order: 1st — no dependencies.
    -- =============================================================================

    CREATE TABLE IF NOT EXISTS states (
        id         SERIAL       PRIMARY KEY,
        state_code VARCHAR(2)   NOT NULL UNIQUE,  -- 2-char USPS abbreviation (e.g. 'CA')
        state_name VARCHAR(50)  NOT NULL          -- Full state name (e.g. 'California')
    );

    -- Seed: all 50 US states
    INSERT INTO states (state_code, state_name) VALUES
        ('AL', 'Alabama'),
        ('AK', 'Alaska'),
        ('AZ', 'Arizona'),
        ('AR', 'Arkansas'),
        ('CA', 'California'),
        ('CO', 'Colorado'),
        ('CT', 'Connecticut'),
        ('DE', 'Delaware'),
        ('FL', 'Florida'),
        ('GA', 'Georgia'),
        ('HI', 'Hawaii'),
        ('ID', 'Idaho'),
        ('IL', 'Illinois'),
        ('IN', 'Indiana'),
        ('IA', 'Iowa'),
        ('KS', 'Kansas'),
        ('KY', 'Kentucky'),
        ('LA', 'Louisiana'),
        ('ME', 'Maine'),
        ('MD', 'Maryland'),
        ('MA', 'Massachusetts'),
        ('MI', 'Michigan'),
        ('MN', 'Minnesota'),
        ('MS', 'Mississippi'),
        ('MO', 'Missouri'),
        ('MT', 'Montana'),
        ('NE', 'Nebraska'),
        ('NV', 'Nevada'),
        ('NH', 'New Hampshire'),
        ('NJ', 'New Jersey'),
        ('NM', 'New Mexico'),
        ('NY', 'New York'),
        ('NC', 'North Carolina'),
        ('ND', 'North Dakota'),
        ('OH', 'Ohio'),
        ('OK', 'Oklahoma'),
        ('OR', 'Oregon'),
        ('PA', 'Pennsylvania'),
        ('RI', 'Rhode Island'),
        ('SC', 'South Carolina'),
