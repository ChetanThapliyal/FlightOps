apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flightops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flightops
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432